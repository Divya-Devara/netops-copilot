frr version 10.1_git
frr defaults traditional
hostname r5
no ipv6 forwarding
!
interface eth1
 ip address 10.1.15.2/30
exit
!
interface lo
 ip address 5.5.5.5/32
exit
!
router bgp 65002
 bgp router-id 5.5.5.5
 no bgp ebgp-requires-policy
 neighbor 10.1.15.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 5.5.5.5/32
 exit-address-family
exit
!
